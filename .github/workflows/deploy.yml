name: Test and deploy

# Two channels on one GitHub Pages site:
# - main: the stable release, at /swamp-fox-labs-rf-toolkit/
# - dev:  the development build, at /swamp-fox-labs-rf-toolkit/beta/
# A push to either branch tests that branch, then builds both and deploys them
# together, since a Pages site is one artifact.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Every job can read the code; only the deploy job below can publish.
permissions:
  contents: read

# A newer push cancels an older deploy still running, since it builds both
# branches anyway. Pull request runs only test, so they get a group of their
# own and never cancel a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-site:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: beta
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            beta/package-lock.json
      - name: Build the stable site (main)
        working-directory: stable
        run: npm ci && npm run build
      - name: Build the beta site (dev)
        working-directory: beta
        run: npm ci && npm run build
        env:
          BASE_PATH: /swamp-fox-labs-rf-toolkit/beta/
      - name: Put the beta under the stable site
        run: |
          mkdir -p site
          cp -r stable/dist/. site/
          mkdir -p site/beta
          cp -r beta/dist/. site/beta/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
