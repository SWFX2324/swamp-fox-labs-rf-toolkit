<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practical RF calculators for planning radio links in the field." />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iPhones can't use an SVG home screen icon, and name the app from the page title without this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RF Toolkit" />
    <title>RF Toolkit</title>
    <script>
      // Apply a saved theme before the first paint, so it doesn't flash.
      try {
        const theme = localStorage.getItem("rf-toolkit:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 10a2 2 0 0 0-1 3.73V22h2v-8.27A2 2 0 0 0 12 10m-4.24-2.24-1.41-1.41A7.94 7.94 0 0 0 4 12a7.94 7.94 0 0 0 2.35 5.65l1.41-1.41A5.96 5.96 0 0 1 6 12c0-1.66.67-3.16 1.76-4.24m8.48 0A5.96 5.96 0 0 1 18 12c0 1.66-.67 3.16-1.76 4.24l1.41 1.41A7.94 7.94 0 0 0 20 12a7.94 7.94 0 0 0-2.35-5.65zM4.93 4.93 3.5 3.5A11.95 11.95 0 0 0 0 12c0 3.31 1.34 6.31 3.5 8.5l1.43-1.43A9.95 9.95 0 0 1 2 12c0-2.76 1.12-5.26 2.93-7.07m14.14 0A9.95 9.95 0 0 1 22 12c0 2.76-1.12 5.26-2.93 7.07l1.43 1.43A11.95 11.95 0 0 0 24 12c0-3.31-1.34-6.31-3.5-8.5z"/></svg>
        <h1>RF Toolkit</h1>
      </div>
      <nav class="tabs" id="tabs" aria-label="Calculators"></nav>
      <div class="top-actions">
        <div class="seg" id="coordToggle" role="group" aria-label="Coordinate format">
          <button type="button" data-format="latlon">Lat/Lon</button>
          <button type="button" data-format="mgrs">MGRS</button>
        </div>
        <a class="settings-link" id="settingsLink" href="#settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></a>
        <button type="button" class="secondary theme-toggle" id="themeToggle"></button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="foot">
      <img class="foot-logo" src="swamp-fox-labs-logo.webp" width="120" height="50" alt="Swamp Fox Labs" loading="lazy" decoding="async" />
      Swamp Fox Labs · <a href="https://github.com/SWFX2324/swamp-fox-labs-rf-toolkit">Source on GitHub</a>
      · Works offline once loaded
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
