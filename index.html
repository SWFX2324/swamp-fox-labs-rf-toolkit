<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practical RF calculators for planning radio links in the field." />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iPhones can't use an SVG home screen icon, and name the app from the page title without this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RF Toolkit" />
    <title>RF Toolkit</title>
    <script>
      // Apply a saved theme before the first paint, so it doesn't flash.
      try {
        const theme = localStorage.getItem("rf-toolkit:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="RF Toolkit: all tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="rf-icon"><path d="M12 13.5v7m-3 0h6M8.2 7.2a5.4 5.4 0 0 0 0 7.6m7.6-7.6a5.4 5.4 0 0 1 0 7.6M5.4 4.4a9.4 9.4 0 0 0 0 13.2m13.2-13.2a9.4 9.4 0 0 1 0 13.2"/><circle cx="12" cy="11" r="2.3"/></svg>
        <h1>RF Toolkit</h1>
      </a>
      <div class="tool-nav" id="toolNav" hidden>
        <a class="home-back" href="#" aria-label="Back to all tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="rf-icon"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></svg><span>All tools</span></a>
        <h2 class="tool-name" id="toolName"></h2>
      </div>
      <div class="top-actions">
        <div class="seg" id="coordToggle" role="group" aria-label="Coordinate format">
          <button type="button" data-format="latlon">Lat/Lon</button>
          <button type="button" data-format="mgrs">MGRS</button>
        </div>
        <a class="settings-link" id="settingsLink" href="#settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="rf-icon"><path d="M4 6h5m4 0h7M4 12h10m4 0h2M4 18h2m4 0h10"/><circle cx="11" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg><span>Settings</span></a>
        <a class="settings-link" id="aboutLink" href="#about" title="About" aria-label="About"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="rf-icon"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1.15" fill="currentColor" stroke="none"/></svg><span>About</span></a>
        <button type="button" class="secondary theme-toggle" id="themeToggle"></button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="foot">
      Swamp Fox Labs · <a href="https://github.com/SWFX2324/swamp-fox-labs-rf-toolkit">Source on GitHub</a>
      · Works offline once loaded
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
